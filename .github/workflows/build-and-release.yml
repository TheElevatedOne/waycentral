name: Build And Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    # Arch, so the binary links against Arch's libalpm, json-c, ...
    container:
      image: archlinux:base-devel

    permissions:
      contents: write

    steps:
    - name: Install dependencies
      run: pacman -Syu --noconfirm --needed git pacman curl json-c libpulse systemd-libs gtk3 pkgconf

    - name: Check-out repository
      uses: actions/checkout@v4

    - name: Read VERSION file
      id: getversion
      run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

    - name: Build
      run: make VERSION=${{ steps.getversion.outputs.version }}

    - name: Create Github Release
      uses: ncipollo/release-action@v1.20.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        artifacts: waycentral-${{ steps.getversion.outputs.version }}.tar.gz
        replacesArtifacts: false
        name: v${{ steps.getversion.outputs.version }} - waycentral
        allowUpdates: true
        tag: ${{ steps.getversion.outputs.version }}
        commit: ${{ github.sha }}
        omitBody: true
